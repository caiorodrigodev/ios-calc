<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Mac OS Style Calculator</title>
</head>
<body>
    <div class="calculator">
        <!-- Title Bar -->
        <div class="title-bar">
            <div class="window-buttons">
                <div class="button-close"></div>
                <div class="button-minimize"></div>
                <div class="button-maximize"></div>
            </div>
        </div>
        
        <!-- Display -->
        <div class="display">
            <div id="history"></div>
            <div id="result">0</div>
        </div>
        
        <!-- Buttons -->
        <div class="buttons">
            <!-- Buttons -->
        </div>
    </div>
</body>
</html>
