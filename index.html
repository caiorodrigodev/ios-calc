<!DOCTYPE html>
<html lang="en">

    <head>
        <meta charset="UTF-8" />
        <meta name="viewport" content="width=device-width, initial-scale=1.0" />
        <title>iOS Calculator</title>
        <script src="https://cdn.tailwindcss.com"></script>
        <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" />
        <link rel="stylesheet" href="styles.css" />

        <!-- Basic Favicon -->
        <link rel="shortcut icon" href="favicon.ico" />
        
        <!-- PNG favicons for different sizes -->
        <link rel="icon" type="image/png" href="/assets/favicon/favicon-96x96.png" sizes="96x96" />
        
        <!-- Apple Touch Icon (for iOS devices) -->
        <link rel="apple-touch-icon" sizes="180x180" href="/assets/favicon/apple-touch-icon.png" />

        <!-- Android Chrome -->
        <link rel="manifest" href="/assets/favicon/site.webmanifest" />

        <link rel="icon" type="image/svg+xml" href="/assets/favicon/favicon.svg" />
        <meta name="apple-mobile-web-app-title" content="Calculator" />
        
    </head>

    <body class="bg-gray-200 flex items-center justify-center min-h-screen">
        <div class="window w-64 fade-in">
            <!-- Title Bar -->
            <div class="title-bar flex items-center px-2 py-2">
                <div class="flex space-x-2 mr-2">
                    <div class="button-close w-3 h-3 rounded-full"></div>
                    <div class="button-minimize w-3 h-3 rounded-full"></div>
                    <div class="button-maximize w-3 h-3 rounded-full"></div>
                </div>
            </div>

            <!-- Display -->
            <div class="display p-4 text-right">
                <div id="history" class="text-gray-400 text-sm h-5 overflow-hidden"></div>
                <div id="result" class="text-3xl font-light mt-1 overflow-hidden">
                    0
                </div>
            </div>

            <!-- Buttons -->
            <div class="grid grid-cols-4 gap-1 p-2 bg-stone-950">
                <!-- Row 1 -->
                <button id="clear-button" class="button-function rounded-full h-14 text-sm">
                    AC
                </button>
                <button onclick="toggleSign()" class="button-function rounded-full h-14">
                    +/-
                </button>
                <button onclick="percentage()" class="button-function rounded-full h-14">
                    %
                </button>
                <button onclick="operator('/')" class="button-operator rounded-full h-14">
                    ÷
                </button>

                <!-- Row 2 -->
                <button onclick="appendNumber('7')" class="button-number rounded-full h-14">
                    7
                </button>
                <button onclick="appendNumber('8')" class="button-number rounded-full h-14">
                    8
                </button>
                <button onclick="appendNumber('9')" class="button-number rounded-full h-14">
                    9
                </button>
                <button onclick="operator('*')" class="button-operator rounded-full h-14">
                    ×
                </button>

                <!-- Row 3 -->
                <button onclick="appendNumber('4')" class="button-number rounded-full h-14">
                    4
                </button>
                <button onclick="appendNumber('5')" class="button-number rounded-full h-14">
                    5
                </button>
                <button onclick="appendNumber('6')" class="button-number rounded-full h-14">
                    6
                </button>
                <button onclick="operator('-')" class="button-operator rounded-full h-14">
                    −
                </button>

                <!-- Row 4 -->
                <button onclick="appendNumber('1')" class="button-number rounded-full h-14">
                    1
                </button>
                <button onclick="appendNumber('2')" class="button-number rounded-full h-14">
                    2
                </button>
                <button onclick="appendNumber('3')" class="button-number rounded-full h-14">
                    3
                </button>
                <button onclick="operator('+')" class="button-operator rounded-full h-14">
                    +
                </button>

                <!-- Row 5 -->
                <button onclick="appendNumber('0')" class="button-number rounded-full h-14 col-span-2 text-center">
                    0
                </button>
                <button onclick="appendNumber(',')" class="button-number rounded-full h-14">
                    ,
                </button>
                <button onclick="calculate()" class="button-operator rounded-full h-14">
                    =
                </button>
            </div>
        </div>

        <script src="script.js"></script>
    </body>

</html>
